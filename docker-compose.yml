services:
  redis:
    image: redis:8
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - backend-net

  auth-service-postgresql:
    image: postgres:17
    environment:
      POSTGRES_DB: ${AUTH_POSTGRES_DB:-auth_service_db}
      POSTGRES_USER: ${AUTH_POSTGRES_USER:-auth_service}
      POSTGRES_PASSWORD: ${AUTH_POSTGRES_PASSWORD:-auth_service_secret}
    ports:
      - "${AUTH_POSTGRES_PORT:-5432}:5432"
    volumes:
      - auth-service-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUTH_POSTGRES_USER:-auth_service} -d ${AUTH_POSTGRES_DB:-auth_service_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend-net

  order-service-postgresql:
    image: postgres:17
    environment:
      POSTGRES_DB: ${ORDER_POSTGRES_DB:-order_service_db}
      POSTGRES_USER: ${ORDER_POSTGRES_USER:-order_service}
      POSTGRES_PASSWORD: ${ORDER_POSTGRES_PASSWORD:-order_service_secret}
    ports:
      - "${ORDER_POSTGRES_PORT:-5433}:5432"
    volumes:
      - order-service-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ORDER_POSTGRES_USER:-order_service} -d ${ORDER_POSTGRES_DB:-order_service_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend-net

  user-service-postgresql:
    image: postgres:17
    environment:
      POSTGRES_DB: ${USER_POSTGRES_DB:-user_service_db}
      POSTGRES_USER: ${USER_POSTGRES_USER:-user_service}
      POSTGRES_PASSWORD: ${USER_POSTGRES_PASSWORD:-user_service_secret}
    ports:
      - "${USER_POSTGRES_PORT:-5434}:5432"
    volumes:
      - user-service-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${USER_POSTGRES_USER:-user_service} -d ${USER_POSTGRES_DB:-user_service_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend-net

  mongodb:
      image: mongo:8
      restart: unless-stopped
      command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
      ports:
        - "${MONGO_PORT:-27017}:27017"
      volumes:
        - mongo-data:/data/db
      healthcheck:
        test: echo "rs.initiate({_id:'rs0',members:[{_id:0,host:'mongodb:27017'}]})" | mongosh --port 27017 --quiet
        interval: 5s
        timeout: 10s
        retries: 8
        start_period: 15s
      networks:
        - backend-net

  kafka:
    image: apache/kafka:3.9.2
    hostname: kafka
    restart: unless-stopped
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:29092
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT_HOST://localhost:${KAFKA_PORT:-9092},PLAINTEXT://kafka:29092"
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 8
      start_period: 30s
    networks:
      - backend-net

  user-service:
    image: zhenya465/user-service:latest
    restart: unless-stopped
    ports:
      - "${USER_SERVICE_PORT:-8081}:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: ${USER_SPRING_DATASOURCE_URL:-jdbc:postgresql://user-service-postgresql:5432/user_service_db}
      SPRING_DATASOURCE_USERNAME: ${USER_SPRING_DATASOURCE_USERNAME:-user_service}
      SPRING_DATASOURCE_PASSWORD: ${USER_SPRING_DATASOURCE_PASSWORD:-user_service_secret}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_APPLICATION_NAME: "user-service"
      MANAGEMENT_OTLP_TRACING_ENDPOINT: "http://otel-collector:4318/v1/traces"
      MANAGEMENT_OTLP_METRICS_EXPORT_URL: "http://otel-collector:4318/v1/metrics"
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 90s
    depends_on:
      user-service-postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend-net

  auth-service:
    image: zhenya465/auth-service:latest
    restart: unless-stopped
    ports:
      - "${AUTH_SERVICE_PORT:-8082}:8082"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: ${AUTH_SPRING_DATASOURCE_URL:-jdbc:postgresql://auth-service-postgresql:5432/auth_service_db}
      SPRING_DATASOURCE_USERNAME: ${AUTH_SPRING_DATASOURCE_USERNAME:-auth_service}
      SPRING_DATASOURCE_PASSWORD: ${AUTH_SPRING_DATASOURCE_PASSWORD:-auth_service_secret}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_APPLICATION_NAME: "auth-service"
      MANAGEMENT_OTLP_TRACING_ENDPOINT: "http://otel-collector:4318/v1/traces"
      MANAGEMENT_OTLP_METRICS_EXPORT_URL: "http://otel-collector:4318/v1/metrics"
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
      JWT_SECRET: ${JWT_SECRET:-Y2hhbmdlLW1lLWluLXByb2R1Y3Rpb24tdGhpcy1pcy1hLTI1Ni1iaXQtc2VjcmV0LWtleS1mb3ItZGV2LW9ubHktY2hhbmdlLWl0}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 90s
    depends_on:
      auth-service-postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend-net

  order-service:
    image: zhenya465/order-service:latest
    restart: unless-stopped
    ports:
      - "${ORDER_SERVICE_PORT:-8083}:8083"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: ${ORDER_SPRING_DATASOURCE_URL:-jdbc:postgresql://order-service-postgresql:5432/order_service_db}
      SPRING_DATASOURCE_USERNAME: ${ORDER_SPRING_DATASOURCE_USERNAME:-order_service}
      SPRING_DATASOURCE_PASSWORD: ${ORDER_SPRING_DATASOURCE_PASSWORD:-order_service_secret}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}
      SPRING_APPLICATION_NAME: "order-service"
      MANAGEMENT_OTLP_TRACING_ENDPOINT: "http://otel-collector:4318/v1/traces"
      MANAGEMENT_OTLP_METRICS_EXPORT_URL: "http://otel-collector:4318/v1/metrics"
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
      USER_SERVICE_URL: ${ORDER_USER_SERVICE_URL:-http://user-service:8081}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 90s
    depends_on:
      order-service-postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
      user-service:
        condition: service_healthy
    networks:
      - backend-net

  payment-service:
    image: zhenya465/payment-service:latest
    restart: unless-stopped
    ports:
      - "${PAYMENT_SERVICE_PORT:-8084}:8084"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_DATA_MONGODB_URI: ${SPRING_DATA_MONGODB_URI:-mongodb://mongodb:27017/payment_service?replicaSet=rs0}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}
      SPRING_APPLICATION_NAME: "payment-service"
      MANAGEMENT_OTLP_TRACING_ENDPOINT: "http://otel-collector:4318/v1/traces"
      MANAGEMENT_OTLP_METRICS_EXPORT_URL: "http://otel-collector:4318/v1/metrics"
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 120s
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - backend-net

  gateway:
    image: zhenya465/gateway-service:latest
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_APPLICATION_NAME: "gateway-service"
      MANAGEMENT_OTLP_TRACING_ENDPOINT: "http://otel-collector:4318/v1/traces"
      MANAGEMENT_OTLP_METRICS_EXPORT_URL: "http://otel-collector:4318/v1/metrics"
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://auth-service:8082}
      USER_SERVICE_URL: ${USER_SERVICE_URL:-http://user-service:8081}
      ORDER_SERVICE_URL: ${ORDER_SERVICE_URL:-http://order-service:8083}
      PAYMENT_SERVICE_URL: ${PAYMENT_SERVICE_URL:-http://payment-service:8084}
      JWT_SECRET: ${JWT_SECRET:-Y2hhbmdlLW1lLWluLXByb2R1Y3Rpb24tdGhpcy1pcy1hLTI1Ni1iaXQtc2VjcmV0LWtleS1mb3ItZGV2LW9ubHktY2hhbmdlLWl0}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 90s
    depends_on:
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
    networks:
      - backend-net

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.100.0
    container_name: otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./configs/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    networks:
      - backend-net

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: prometheus
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--enable-feature=otlp-write-receiver"]
    volumes:
      - ./configs/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - backend-net

  tempo:
    image: grafana/tempo:2.5.0
    container_name: tempo
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./configs/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    networks:
      - backend-net

  loki:
    image: grafana/loki:3.0.0
    container_name: loki
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports:
      - "3100:3100"
    networks:
      - backend-net

  promtail:
    image: grafana/promtail:3.0.0
    container_name: promtail
    command: ["-config.file=/etc/promtail/config.yml"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro 
      - /var/lib/docker/containers:/var/lib/docker/containers:ro 
      - ./configs/promtail.yml:/etc/promtail/config.yml:ro
    networks:
      - backend-net
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:11.1.0
    container_name: grafana
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./configs/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
    depends_on:
      - prometheus
      - loki
      - tempo
    networks:
      - backend-net

volumes:
  redis-data:
  auth-service-db-data:
  order-service-db-data:
  user-service-db-data:
  mongo-data:
  prometheus-data:
  tempo-data:
  grafana-data:

networks:
  backend-net:
    driver: bridge
